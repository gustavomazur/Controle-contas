spring.application.name=controle-contas-api

# lê as variáveis do .env (o mesmo que o Docker usa pra lê)
spring.config.import=optional:file:.env[.properties]
##pg adimin está dentro do docker mais api está fora então precisa do localhost:5433 pra ela ver 
spring.datasource.url=jdbc:postgresql://localhost:5433/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

